worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    error_log /dev/null crit;


    log_format main '$status $body_bytes_sent $request_time';
    access_log /dev/stdout main;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    client_body_timeout 10s;
    client_header_timeout 10s;
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    upstream auth { server auth:8000; }
    upstream stt  { server stt:8000; }

    server {
        listen 80;
        return 400;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/tls/server.pem;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.3;

        ssl_ecdh_curve prime256v1:secp384r1;
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;

        location = /auth/session/status {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://auth;
        }

        location /auth/ {
            limit_req zone=auth burst=30 nodelay;
            proxy_pass http://auth;
        }
        location = /user/profile { limit_req zone=api burst=20 nodelay; proxy_pass http://auth; }
        location /user/          { limit_req zone=auth burst=10 nodelay; proxy_pass http://auth; }
        location = /user         { limit_req zone=auth burst=5 nodelay; proxy_pass http://auth; }
        location /device/        { limit_req zone=auth burst=30 nodelay; proxy_pass http://auth; }

        location /stt/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://stt;
        }
        location /tts/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://stt;
        }
        location /system/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://stt;
        }

        location / { return 404; }
    }
}
